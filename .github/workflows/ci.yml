name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint)
        run: ruff check spire_reactor dashboard tests

      - name: Pytest (unit)
        env:
          # Hard-disable live side effects in CI
          DEMO_MODE: "true"
          SNOWFLAKE_WRITE: "false"
          TEMPORAL_USE: "false"
        run: |
          pytest tests -m "unit or not integration" --cov=spire_reactor --cov-report=term-missing

      - name: Import smoke (packages load)
        run: |
          python -c "from spire_reactor.store import landing, snowflake_client"
          python -c "from spire_reactor.temporal import settings"
          python -c "from spire_reactor.activities import fusion"
          python -c "from spire_reactor.config import integrations"
