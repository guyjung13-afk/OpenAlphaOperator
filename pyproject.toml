[project]
name = "openalphaoperator"
version = "0.1.0"
description = "Sovereign Gas Burn PCI + ETRM Reactor"
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "-q",
  "--strict-markers",
  "--tb=short",
]
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "unit: pure unit tests (no network)",
  "integration: optional live service tests (skipped in CI)",
]

[tool.coverage.run]
source = ["spire_reactor"]
omit = [
  "*/__pycache__/*",
  "spire_reactor/main.py",  # FastAPI app entry; covered later
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 0

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["spire_reactor", "dashboard", "tests"]

[tool.ruff.lint]
# Scaffold: catch real bugs first; style rules can tighten later
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "W",   # pycodestyle warnings
]
ignore = [
  "E501",  # line length — existing codebase is wide
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]
